[project]
name = "jlawcite"
version = "2.0.0"
description = "JLaw-CiteGraph: deterministic citation graph and embedding-free search for Japanese statutes (e-Gov 法令)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "yabooung"}]
keywords = ["Japanese law", "legal NLP", "citation graph", "e-Gov", "statute", "legal information retrieval"]
dependencies = [
    "pydantic>=2.5",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = ["mcp>=1.0.0"]

[project.urls]
Homepage = "https://github.com/yabooung/jp-law-citation-graph"

[project.scripts]
jlawcite = "jlawcite.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jlawcite = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
